# Local prototype: Django (server-rendered frontend + PostgreSQL).
# The backend and database keep the same Nix environment as flake.lock.
#
#   ./run                             # website at http://localhost:8000
#   docker compose run --rm --entrypoint /app/.venv/bin/python web -m pytest
services:
  db:
    build:
      context: ./docker/db
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "opinionsearch", "-d", "opinionsearch"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    entrypoint: ["/bin/sh", "/app/docker/app/entrypoint.sh"]
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: opinionsearch
      DB_USER: opinionsearch
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/topics/', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 30m
      retries: 24
    volumes:
      # Reuse the image while editing source; restart for Python/template changes.
      - ./docker/app:/app/docker/app:ro
      - ./opinions:/app/opinions:ro
      - ./opinionsearch:/app/opinionsearch:ro
      # Model weights are multi-GB (see CLAUDE.md's Opinion.save() gotcha) --
      # keep them across `down`/`up` instead of re-downloading every time.
      - hf-cache:/data/hf-cache

volumes:
  db-data:
  hf-cache:
