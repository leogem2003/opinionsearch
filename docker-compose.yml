# Local prototype: Vite frontend, Django API and PostgreSQL.
# The backend and database keep the same Nix environment as flake.lock.
#
#   docker compose up --build          # website at http://localhost:5174
#   docker compose run --rm --entrypoint uv web run pytest  # fast tests (see README)
services:
  db:
    build:
      context: ./docker/db
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "opinionsearch", "-d", "opinionsearch"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: opinionsearch
      DB_USER: opinionsearch
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/topics/', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 24
    volumes:
      # Model weights are multi-GB (see CLAUDE.md's Opinion.save() gotcha) --
      # keep them across `down`/`up` instead of re-downloading every time.
      - hf-cache:/data/hf-cache

  frontend:
    image: node:24-alpine
    working_dir: /app
    init: true
    command: ["sh", "-c", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0"]
    environment:
      OPINIONSEARCH_API_TARGET: http://web:8000
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - ./opinionsearch/frontend:/app
      # Container dependencies stay separate from host-installed packages.
      - frontend-node-modules:/app/node_modules

volumes:
  db-data:
  hf-cache:
  frontend-node-modules:
