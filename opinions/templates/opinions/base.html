{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HiveMind{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'opinions/css/site.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="civic-page {% block page_variant %}{% endblock %}">
    <a class="civic-skip" href="#main-content">Skip to content</a>
    <header class="civic-header">
      <div class="civic-container civic-header-inner">
        <a class="civic-brand" href="/" aria-label="HiveMind home">
          <img class="civic-brand-mark" src="{% static 'opinions/brand/hivemind-symbol-128.png' %}" width="56" height="56" alt="">
          <span class="civic-brand-copy"><strong>HiveMind</strong><span>Public dialogue</span></span>
        </a>
        <nav class="civic-nav" aria-label="Main navigation">
          <a href="/#share-issue">Share an issue</a>
          <a href="/topics/">Explore topics</a>
          <a href="{% url 'opinions:search' %}">Search opinions <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg></a>
        </nav>
      </div>
    </header>

    {% block content %}{% endblock %}

    <footer class="civic-footer">
      <div class="civic-container civic-footer-inner">
        <p><strong>HiveMind</strong></p>
        <nav aria-label="Prototype information">
          <a href="/privacy-policy/">Privacy</a>
          <a href="/terms-and-conditions/">Prototype information</a>
        </nav>
      </div>
    </footer>
  </div>
  <script src="{% static 'opinions/js/site.js' %}"></script>
  {% block extra_body %}{% endblock %}
</body>
</html>
