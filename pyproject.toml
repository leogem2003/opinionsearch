[project]
name = "opinionsearch"
version = "0.1.0"
description = "opinions search engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "flagembedding",
    "pgvector>=0.3",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "django-debug-toolbar>=4.3.0",
    "black>=24.0.0",
    # For notebooks/umap_projection.ipynb: the 2D projection experiment that
    # design.md's read path calls for. Not imported by the app itself yet.
    "umap-learn>=0.5.6",
    "matplotlib>=3.8",
    "jupyterlab>=4.0",
]

[tool.uv.sources]
flagembedding = { git = "https://github.com/FlagOpen/FlagEmbedding.git" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "opinionsearch.settings"
python_files = "test_*.py"
# The opinionsearch DB role isn't a superuser, so it can't CREATE EXTENSION
# on a test database Django creates from scratch (see CLAUDE.md gotchas).
# --reuse-db keeps reusing a test_opinionsearch database that already has
# postgis/vector installed (set up the same way as the main database) instead
# of dropping and recreating it every run.
addopts = "--reuse-db"

